name: Learn article draft

# Picks the next question from the backlog in generate-article.mjs, generates
# an article draft in Billy's voice, and saves it to content-drafts/ on main.
# Nothing in app/ changes, so nothing publishes. Billy reviews the draft and
# promotes it by moving the article object into app/lib/articles.ts (see
# CLAUDE.md). Netlify auto-deploys main. Needs repo secret ANTHROPIC_API_KEY.
# Run manually anytime from the Actions tab ("Run workflow").

on:
  schedule:
    # Every Monday, so Tuesday's auto-promote has a fresh (local-first) draft.
    # 16:00 UTC = 9:00 AM Pacific (PDT), 8:00 AM in winter (PST).
    # NOTE: never combine a day-of-month range with a weekday in one cron line.
    # Cron ORs them: the old "0 16 1-7 * 2" fired every day of the 1st week
    # plus every Tuesday, drafting ~16 articles a month.
    - cron: "0 16 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: learn-article-main-writes
  cancel-in-progress: false

jobs:
  draft-article:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate the draft article
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/generate-article.mjs

      - name: Commit and push the draft
        env:
          SLUG: ${{ steps.generate.outputs.slug }}
        run: |
          if [ -z "$(git status --porcelain content-drafts)" ]; then
            echo "No new draft this run; nothing to commit."
            exit 0
          fi
          git config user.name "billy-lush-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content-drafts
          git commit -m "Draft Learn article: $SLUG (review needed)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, retrying with rebase ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "Failed to push after retries."
          exit 1
